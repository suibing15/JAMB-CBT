{% extends 'base.html' %}
{% block content %}

<div class="page-container">

<h2 class="form-title">REGISTER FOR JAMB TRAINING</h2>

<form method="POST" enctype="multipart/form-data" class="form-box">
    {% csrf_token %}

    <label>Passport Photo:</label>
    <input type="file" name="passport" required class="input">

    <label>Full Name:</label>
    <input type="text" name="full_name" required class="input">

    <label>Phone Number (Login ID):</label>
    <input type="text" name="phone" required class="input">

    <label>Select 4 Subjects:</label>
    <select name="subject1" required class="subject-select input">
        <option value="">Select Subject 1</option>
        {% for value, label in subjects %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
    </select>

    <select name="subject2" required class="subject-select input">
        <option value="">Select Subject 2</option>
        {% for value, label in subjects %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
    </select>

    <select name="subject3" required class="subject-select input">
        <option value="">Select Subject 3</option>
        {% for value, label in subjects %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
    </select>

    <select name="subject4" required class="subject-select input">
        <option value="">Select Subject 4</option>
        {% for value, label in subjects %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
    </select>

    <div id="subject-warning" style="color:red; margin-top:5px; display:none;">
        Subject already selected!
    </div>

    <label>Address:</label>
    <input type="text" name="address" required class="input">

    <label>CBT Preference:</label>
    <select name="cbt_preference" required class="input">
        <option value="Phone">Take Test on Phone</option>
        <option value="Center">Practice at Training Center</option>
    </select>

    <label>Signature (Draw below):</label>
    <canvas id="signature-pad"></canvas>
    <button type="button" id="clear-signature" class="btn-clear">Clear Signature</button>

    <input type="hidden" name="signature_data" id="signature_data">

    <button type="submit" class="btn-submit">Submit Registration</button>

</form>

</div>

<script>
// =====================
// Signature Pad
// =====================
let canvas = document.getElementById("signature-pad");
let ctx = canvas.getContext("2d");
let drawing=false;

function pos(e){
  let r = canvas.getBoundingClientRect();
  return {x:(e.touches?e.touches[0].clientX:e.clientX)-r.left, y:(e.touches?e.touches[0].clientY:e.clientY)-r.top};
}

function start(e){ drawing=true; draw(e); }
function end(){ drawing=false; ctx.beginPath(); }
function draw(e){
 if(!drawing)return;
 let p=pos(e);
 ctx.lineWidth=2; ctx.lineCap="round"; ctx.strokeStyle="#000";
 ctx.lineTo(p.x,p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x,p.y);
}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",draw);
canvas.addEventListener("mouseup",end);
canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchmove",e=>{draw(e);e.preventDefault();});
canvas.addEventListener("touchend",end);

document.getElementById("clear-signature").onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
document.querySelector("form").onsubmit=()=>document.getElementById("signature_data").value=canvas.toDataURL("image/png");

// =====================
// BLOCK DUPLICATE SUBJECTS WITH WARNING
// =====================
const selects = document.querySelectorAll(".subject-select");
const warning = document.getElementById("subject-warning");

function checkDuplicates() {
    const selectedValues = Array.from(selects).map(s => s.value).filter(v => v);
    let hasDuplicate = new Set(selectedValues).size !== selectedValues.length;

    warning.style.display = hasDuplicate ? "block" : "none";

    // Optionally, prevent form submission if duplicates exist
    return !hasDuplicate;
}

selects.forEach(s => s.addEventListener("change", checkDuplicates));

// Optional: block submission if duplicates exist
document.querySelector("form").addEventListener("submit", function(e){
    if(!checkDuplicates()){
        e.preventDefault();
        alert("Please select 4 unique subjects before submitting.");
    }
});
</script>

{% endblock %}
